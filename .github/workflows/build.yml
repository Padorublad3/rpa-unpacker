name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Nuitka[app]"

      - name: Build with Nuitka (standalone)
        run: |
          python -m nuitka --standalone --output-filename=unrpa-cli.exe --msvc=latest --assume-yes-for-downloads cli.py

      - name: Package into ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path cli.dist\* -DestinationPath unrpa-cli-windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unrpa-cli-windows
          path: unrpa-cli-windows.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: unrpa-cli-windows.zip
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}